{% load blog_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8">
        <title>{% block title %}{% endblock %}</title>
        <link href="{% static "css/blog.css" %}" rel="stylesheet">
    </head>
    <body>
        <div id="content">
            {% block content %}
            {% endblock %}
        </div>
        <div id="sidebar">
            <h2>My Blog</h2>
            <p>I've written {% total_posts %} posts so far.</p>
            <h3>Latest Posts</h3>
            {% show_latest_posts 3 %}
        </div>
    </body>
</html>
